backend:
  name: github
  repo: raddenpattah/Katalog-Affiliate
  branch: main
  base_url: https://alfeto-decap-auth.alfeto.workers.dev
  auth_endpoint: /auth

media_folder: public/images/blog
public_folder: /images/blog

collections:
  - name: products
    label: Produk
    folder: src/data/products
    create: true
    extension: json
    format: json
    identifier_field: title
    slug: "{{slug}}"
    view_filters:
      - label: Dinding & Panel
        field: category
        pattern: dinding
      - label: Tanaman & Pot
        field: category
        pattern: tanaman
      - label: Lampu & Cermin
        field: category
        pattern: lampu
      - label: Aksesoris Ruang
        field: category
        pattern: aksesoris
      - label: Lantai & Alas
        field: category
        pattern: lantai-dan-alas
    fields:
      - label: ID Produk
        name: id
        widget: string
      - label: Nama Produk
        name: title
        widget: string
      - label: Deskripsi Produk
        name: description
        widget: text
        required: false
      - label: Kategori
        name: category
        widget: select
        options:
          - label: Dinding & Panel
            value: dinding
          - label: Tanaman & Pot
            value: tanaman
          - label: Lampu & Cermin
            value: lampu
          - label: Aksesoris Ruang
            value: aksesoris
          - label: Lantai & Alas
            value: lantai-dan-alas
      - label: Gambar Produk
        name: image
        widget: image
        media_folder: /public/images/products
        public_folder: /images/products
        choose_url: true
      - label: Link Shopee
        name: shopeeUrl
        widget: string
      - label: Label Promo
        name: badge
        widget: string
        required: false
  - name: blog
    label: Blog
    folder: src/content/blog
    create: true
    slug: "{{slug}}"
    extension: md
    format: yaml-frontmatter
    fields:
      - label: Judul
        name: title
        widget: string
      - label: Deskripsi
        name: description
        widget: text
      - label: Tanggal Terbit
        name: pubDate
        widget: datetime
        date_format: "YYYY-MM-DD"
        time_format: false
        format: "YYYY-MM-DD"
      - label: Gambar Utama
        name: heroImage
        widget: image
      - label: Kategori
        name: category
        widget: select
        options:
          - label: Dinding & Panel
            value: dinding
          - label: Tanaman & Pot
            value: tanaman
          - label: Lampu & Cermin
            value: lampu
          - label: Aksesoris Ruang
            value: aksesoris
          - label: Lantai & Alas
            value: lantai-dan-alas
      - label: Penulis
        name: author
        widget: string
        default: Alfeto
      - label: ID Produk
        name: productIds
        widget: relation
        collection: products
        search_fields:
          - title
          - id
          - category
        value_field: id
        display_fields:
          - "{{title}} ({{category}})"
        multiple: true
        required: false
      - label: Draft
        name: draft
        widget: boolean
        default: false
      - label: Isi Artikel
        name: body
        widget: markdown
