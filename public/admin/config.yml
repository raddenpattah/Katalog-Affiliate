backend:
  name: github
  repo: raddenpattah/Katalog-Affiliate
  branch: main
  base_url: https://alfeto-decap-auth.alfeto.workers.dev
  auth_endpoint: /auth

media_folder: public/images/blog
public_folder: /images/blog

collections:
  - name: categories
    label: Kategori
    folder: src/data/category-options
    create: true
    delete: false
    extension: json
    format: json
    identifier_field: title
    slug: "{{id}}"
    fields:
      - label: ID Kategori
        name: id
        widget: string
        pattern:
          - '^[a-z0-9]+(?:-[a-z0-9]+)*$'
          - 'Gunakan huruf kecil, angka, dan tanda hubung. Contoh: dekorasi-kamar'
      - label: Nama Kategori
        name: title
        widget: string
  - name: products
    label: Produk
    folder: src/data/products
    create: true
    extension: json
    format: json
    identifier_field: title
    slug: "{{slug}}"
    view_filters:
      - label: Dinding & Panel
        field: category
        pattern: dinding
      - label: Tanaman & Pot
        field: category
        pattern: tanaman
      - label: Lampu & Cermin
        field: category
        pattern: lampu
      - label: Aksesoris Ruang
        field: category
        pattern: aksesoris
      - label: Lantai & Alas
        field: category
        pattern: lantai-dan-alas
    fields:
      - label: ID Produk
        name: id
        widget: string
      - label: Nama Produk
        name: title
        widget: string
      - label: Deskripsi Produk
        name: description
        widget: text
        required: false
      - label: Kategori
        name: category
        widget: relation
        collection: categories
        search_fields:
          - title
          - id
        value_field: id
        display_fields:
          - title
      - label: Gambar Produk
        name: image
        widget: image
        media_folder: /public/images/products
        public_folder: /images/products
        choose_url: true
      - label: Link Shopee
        name: shopeeUrl
        widget: string
      - label: Label Promo
        name: badge
        widget: string
        required: false
  - name: blog
    label: Blog
    folder: src/content/blog
    create: true
    slug: "{{slug}}"
    extension: md
    format: yaml-frontmatter
    fields:
      - label: Judul
        name: title
        widget: string
      - label: Deskripsi
        name: description
        widget: text
      - label: Judul SEO
        name: seoTitle
        widget: string
        required: false
        hint: Jika kosong, judul artikel dipakai sebagai judul SEO.
      - label: Deskripsi SEO
        name: seoDescription
        widget: text
        required: false
        hint: Jika kosong, deskripsi artikel dipakai sebagai deskripsi SEO.
      - label: Tags
        name: tags
        widget: list
        required: false
        field:
          label: Tag
          name: tag
          widget: string
      - label: Tanggal Terbit
        name: pubDate
        widget: datetime
        date_format: "YYYY-MM-DD"
        time_format: false
        format: "YYYY-MM-DD"
      - label: Gambar Utama
        name: heroImage
        widget: image
      - label: Galeri Gambar
        name: galleryImages
        widget: list
        required: false
        fields:
          - label: Gambar
            name: image
            widget: image
          - label: Alt Text
            name: alt
            widget: string
            hint: Deskripsikan isi gambar untuk aksesibilitas.
          - label: Caption
            name: caption
            widget: text
            required: false
      - label: Kategori
        name: category
        widget: relation
        collection: categories
        search_fields:
          - title
          - id
        value_field: id
        display_fields:
          - title
      - label: Penulis
        name: author
        widget: string
        default: Alfeto
      - label: ID Produk
        name: productIds
        widget: relation
        collection: products
        search_fields:
          - title
          - id
          - category
        value_field: id
        display_fields:
          - "{{title}} ({{category}})"
        multiple: true
        required: false
      - label: Draft
        name: draft
        widget: boolean
        default: false
      - label: Isi Artikel
        name: body
        widget: markdown
