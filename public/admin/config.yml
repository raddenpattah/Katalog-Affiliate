backend:
  name: github
  repo: raddenpattah/Katalog-Affiliate
  branch: main
  base_url: https://alfeto-decap-auth.alfeto.workers.dev
  auth_endpoint: /auth

publish_mode: simple

media_folder: public/images/blog
public_folder: /images/blog

collections:
  - name: categories
    label: Kategori
    folder: src/data/category-options
    create: true
    delete: false
    extension: json
    format: json
    identifier_field: title
    slug: "{{id}}"
    fields:
      - label: ID Kategori
        name: id
        widget: string
        pattern:
          - '^[a-z0-9]+(?:-[a-z0-9]+)*$'
          - 'Gunakan huruf kecil, angka, dan tanda hubung. Contoh: dekorasi-kamar'
      - label: Nama Kategori
        name: title
        widget: string
  - name: products
    label: Produk
    folder: src/data/products
    create: true
    extension: json
    format: json
    identifier_field: title
    slug: "{{slug}}"
    view_filters:
      - label: Dinding & Panel
        field: category
        pattern: dinding
      - label: Tanaman & Pot
        field: category
        pattern: tanaman
      - label: Lampu & Cermin
        field: category
        pattern: lampu
      - label: Aksesoris Ruang
        field: category
        pattern: aksesoris
      - label: Lantai & Alas
        field: category
        pattern: lantai-dan-alas
    fields:
      - label: ID Produk
        name: id
        widget: ai-product-id
        required: true
        hint: "ID produk baru harus kebab-case huruf kecil; ID lama boleh tetap dipakai tanpa perubahan"
      - label: Nama Produk
        name: title
        widget: ai-product-title
        hint: "Judul rapi untuk blog, maksimal 60 karakter; dapat dibuat dengan AI dari deskripsi Shopee"
      - label: Title Pinterest
        name: titlePinterest
        widget: ai-product-title-pinterest
        pattern:
          - '^[\s\S]{0,90}$'
          - 'Maksimal 90 karakter'
        hint: "Judul Pinterest maksimal 90 karakter; klik AI setelah deskripsi Shopee ditempel"
        required: false
      - label: Slug
        name: slug
        widget: ai-product-slug
        required: true
        pattern:
          - '^[a-z0-9]+(?:-[a-z0-9]+)*$'
          - 'Gunakan huruf kecil, angka, dan tanda hubung. Contoh: dekorasi-kamar'
      - label: Deskripsi Produk
        name: description
        widget: ai-product-description
        required: false
        pattern:
          - '^[\s\S]{0,5000}$'
          - 'Maksimal 5000 karakter'
        hint: "Tempel deskripsi mentah dari Shopee (minimal 80 karakter untuk AI); hasil AI menjadi 2-3 paragraf"
      - label: Meta Description
        name: metaDescription
        widget: ai-product-meta-description
        required: false
        pattern:
          - '^[\s\S]{0,160}$'
          - 'Maksimal 160 karakter'
        hint: '130-155 karakter; diisi oleh AI atau dapat disunting'
      - label: Kategori
        name: category
        widget: relation
        collection: categories
        search_fields:
          - title
          - id
        value_field: id
        display_fields:
          - title
      - label: Gambar Produk
        name: image
        widget: image
        media_folder: /public/images/products
        public_folder: /images/products
        choose_url: true
      - label: Gambar Tambahan
        name: gambar_tambahan
        widget: list
        required: false
        field:
          label: Gambar
          name: gambar
          widget: image
          media_folder: /public/images/products
          public_folder: /images/products
      - label: Spesifikasi
        name: specs
        widget: ai-product-specifications
        required: false
      - label: Link Shopee
        name: shopeeUrl
        widget: string
        required: true
        pattern:
          - '^https?://[^\s/?#]+(?:[/?#][^\s]*)?$'
          - 'Masukkan URL yang diawali http:// atau https://'
      - label: Label Promo
        name: badge
        widget: string
        required: false
  - name: blog
    label: Blog
    folder: src/content/blog
    create: true
    slug: "{{slug}}"
    extension: md
    format: yaml-frontmatter
    fields:
      - label: Judul
        name: title
        widget: string
      - label: Deskripsi
        name: description
        widget: ai-description
      - label: Kategori
        name: category
        widget: relation
        collection: categories
        search_fields:
          - title
          - id
        value_field: id
        display_fields:
          - title
      - label: Tanggal & Jam Terbit
        name: publishAt
        widget: datetime
        required: false
        date_format: "YYYY-MM-DD"
        time_format: "HH:mm"
        format: "YYYY-MM-DDTHH:mm:ssZ"
        picker_utc: false
        hint: "Kosongkan dan klik Publish untuk terbit langsung. Isi tanggal dan jam untuk menjadwalkan."
      - label: Gambar Utama
        name: heroImage
        widget: image
      - label: Draft
        name: draft
        widget: boolean
        default: true
      - label: Isi Artikel
        name: body
        widget: ai-markdown
      - label: Pengaturan Lanjutan
        name: advanced
        widget: object
        collapsed: true
        fields:
          - label: Judul SEO
            name: seoTitle
            widget: string
            required: false
            hint: "Jika kosong, judul artikel dipakai sebagai judul SEO."
          - label: Deskripsi SEO
            name: seoDescription
            widget: text
            required: false
            hint: "Jika kosong, deskripsi artikel dipakai sebagai deskripsi SEO."
          - label: Tags
            name: tags
            widget: ai-tags
            required: false
            field:
              label: Tag
              name: tag
              widget: string
          - label: Galeri Gambar
            name: galleryImages
            widget: list
            required: false
            fields:
              - label: Gambar
                name: image
                widget: image
              - label: Alt Text
                name: alt
                widget: string
                hint: "Deskripsikan isi gambar untuk aksesibilitas."
              - label: Caption
                name: caption
                widget: text
                required: false
          - label: ID Produk
            name: productIds
            widget: relation
            collection: products
            search_fields:
              - title
              - id
              - category
            value_field: id
            display_fields:
              - "{{title}} ({{category}})"
            multiple: true
            default: []
            required: false
            hint: "ID produk dari katalog — contoh: rak-ambalan-30cm"
          - label: Artikel Terkait
            name: internalLinks
            widget: ai-internal-links
            collection: blog
            search_fields:
              - title
              - description
            value_field: "{{slug}}"
            display_fields:
              - "{{title}}"
            multiple: true
            required: false
          - label: Tipe CTA
            name: ctaType
            widget: ai-cta-type
            options:
              - label: Produk
                value: product
              - label: Artikel
                value: article
            default: product
            required: false
          - label: CTA Pin (opsional)
            name: pinCta
            widget: string
            required: false
            hint: "Teks CTA untuk Pinterest Pin. Kalau kosong, AI generate otomatis dari judul. Contoh: 'Simak cara pilih rak estetik, lanjut baca yuk bestie'"
